<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>담보비율 계산기</title>

  <!-- 버전을 정확히 고정한다 (2026-09-03). @18처럼 두면 CDN이 다른 18.x를 줄 때 동작이 바뀔 수 있다. sw.js의 CDN_ASSETS와 한 글자도 다르면 안 된다 -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- 클라우드 저장 (finance-manager-ca4ca RTDB의 /dambo) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

  <style>
/* 맨 위에서 아래로 당기면 크롬이 페이지를 새로고침하던 것을 막는다 (2026-09-28 사용자 요청 — 새로고침되며 로그인 화면이 다시 떴다) */
html, body { overscroll-behavior-y: none; }
    body { font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; }
    input[type=range] { accent-color: #3b82f6; }
    input[type=range]::-webkit-slider-thumb { cursor: pointer; }

    /* ── 접속 잠금 화면 ── */
    #appLockScreen {
      position: fixed; inset: 0; z-index: 100; display: flex;
      align-items: center; justify-content: center; padding: 24px;
      background: #0f172a;
    }
    .lock-card {
      background: #fff; border-radius: 20px; padding: 32px 26px;
      width: 100%; max-width: 340px; text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,.35);
    }
    .lock-icon  { font-size: 40px; }
    .lock-title { font-size: 18px; font-weight: 800; color: #1e293b; margin-top: 10px; }
    .lock-sub   { font-size: 12px; color: #64748b; margin-top: 6px; }
    #appLockScreen.resuming .lock-btn-google { display: none; }   /* 로그인했던 기기 (2026-09-29) */
    .lock-btn-google {
      margin-top: 20px; width: 100%; display: flex; align-items: center; justify-content: center;
      gap: 8px; padding: 12px; border: 1px solid #e2e8f0; border-radius: 12px;
      background: #fff; font-size: 14px; font-weight: 700; color: #334155; cursor: pointer;
    }
    .lock-btn-google:hover:not(:disabled) { background: #f8fafc; }
    .lock-btn-google:disabled { opacity: .5; cursor: default; }
    .lock-error { font-size: 12px; color: #dc2626; margin-top: 12px; min-height: 16px; }

    /* ============ 태블릿 (2026-09-28) ============
       갤럭시 탭을 가로로 두고 쓸 때. 폰 화면은 건드리지 않고 넓을 때만 덮어쓴다.
       - 폭 제한(max-w-2xl)을 풀고 탭마다 두 단: 왼쪽 입력 / 오른쪽 결과
       - 화면 높이를 채운다 (카드가 남는 높이를 나눠 갖는다, min-height라 길면 스크롤)
       tb-* 클래스는 폰에서는 아무 규칙이 없는 표식이다.
       Tailwind CDN이 이 style 뒤에 규칙을 붙이므로 #root를 앞에 달아 우선순위로 이긴다 */
    @media (min-width: 900px) and (orientation: landscape) {
      #root .tb-app {
        max-width: 1320px;
        padding: 20px 28px 24px;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
      }
      #root .tb-header { padding: 18px 28px; margin-bottom: 14px; }
      #root .tb-header h1 { font-size: 24px; }
      #root .tb-header p, #root .tb-header .text-xs { font-size: 13px; }
      #root .tb-header .text-3xl { font-size: 36px; line-height: 40px; }
      #root .tb-tabs { padding: 6px; margin-bottom: 16px; }
      #root .tb-tabs button { font-size: 15px; padding: 11px 0; }

      /* 탭 내용이 남는 높이를 채운다 (보이는 탭만 — 숨긴 탭은 인라인 display:none이 이긴다) */
      #root .tb-panel { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; }
      #root .tb-panel > .tb-buy, #root .tb-panel > .tb-scn { flex: 1 1 auto; }

      /* 입력칸·버튼: 팔 길이에서 보는 화면이라 조금 키운다 */
      #root .tb-app input[type=text], #root .tb-app input[type=number], #root .tb-app select {
        font-size: 16px; padding-top: 9px; padding-bottom: 9px;
      }
      #root .tb-app label { font-size: 13px; }
      #root .tb-app h3 { font-size: 16px; }

      /* ── 담보비율 카드 (포트폴리오·시나리오 오른쪽) ── */
      #root .tb-ratio {
        display: flex; flex-direction: column;
        margin-bottom: 0; padding: 28px 28px 24px;
      }
      #root .tb-ratio .text-gray-500.font-semibold { font-size: 18px; }
      #root .tb-ratio-num { font-size: 56px; line-height: 1.1; }
      #root .tb-ratio-req { font-size: 13px; margin-top: 4px; }
      #root .tb-gauge { margin: auto 0; padding: 28px 0 8px; }
      #root .tb-gauge > .h-5 { height: 28px; }
      #root .tb-gauge .w-0\.5 { height: 28px; width: 3px; }
      #root .tb-gauge .-top-5 { font-size: 14px; top: -24px; }
      #root .tb-ratio-grid3, #root .tb-ratio-grid2 { gap: 12px; }
      #root .tb-ratio-grid3 { margin-bottom: 12px; }
      #root .tb-ratio-grid3 > div, #root .tb-ratio-grid2 > div { padding: 18px 10px; }
      #root .tb-ratio-grid3 .text-xs, #root .tb-ratio-grid2 .text-xs { font-size: 13px; margin-bottom: 6px; }
      #root .tb-ratio-grid3 .font-bold { font-size: 16px; }
      #root .tb-ratio-grid2 .font-bold { font-size: 19px; }

      /* ── 포트폴리오: 왼쪽 종목표·기타 자산 / 오른쪽 담보비율 ── */
      #root .tb-panel-portfolio {
        display: grid;
        grid-template-columns: minmax(0, 7fr) minmax(0, 5fr);
        column-gap: 20px;
        align-items: stretch;
      }
      #root .tb-panel-portfolio > .tb-ratio { grid-column: 2; grid-row: 1; }
      #root .tb-panel-portfolio > .tb-inputs { grid-column: 1; grid-row: 1; display: flex; flex-direction: column; min-height: 0; }
      #root .tb-table-wrap {
        flex: 1 1 auto; margin-bottom: 14px;
        background: #fff; border-radius: 12px;
        box-shadow: 0 1px 3px rgba(0,0,0,.1), 0 1px 2px -1px rgba(0,0,0,.1);
      }
      #root .tb-table { box-shadow: none; font-size: 15px; table-layout: fixed; }
      #root .tb-table th { font-size: 13px; padding: 12px 14px; }
      /* 칸 폭 고정 — 수정 줄에 입력칸이 들어와도 표가 출렁이지 않게 */
      #root .tb-table th:nth-child(1) { width: 26%; }
      #root .tb-table th:nth-child(2) { width: 11%; }
      #root .tb-table th:nth-child(3) { width: 14.5%; }
      #root .tb-table th:nth-child(4) { width: 18%; }
      #root .tb-table th:nth-child(5) { width: 12%; }
      #root .tb-table th:nth-child(6) { width: 18.5%; }
      #root .tb-table td { padding: 14px 14px; white-space: nowrap; }
      #root .tb-table td:first-child { white-space: normal; }
      #root .tb-table tr.bg-yellow-50 td { padding: 10px 6px; }
      #root .tb-table tr.bg-yellow-50 input, #root .tb-table tr.bg-yellow-50 select { padding: 8px 8px; font-size: 15px; }
      #root .tb-table td .text-xs, #root .tb-table td button { font-size: 13px; }
      #root .tb-table td button { padding: 4px 6px; }
      #root .tb-add { align-self: flex-start; font-size: 15px; padding: 10px 22px; margin-bottom: 14px; }
      #root .tb-etc { padding: 20px 22px; }

      /* ── 추가매수: 입력 | 목록 (두 단, 각각 화면 높이). 「전후 비교」 세 번째 단은 2026-10-09 삭제 ── */
      #root .tb-buy {
        display: grid;
        grid-template-columns: minmax(0, 5fr) minmax(0, 6fr);
        gap: 20px;
        min-height: 0;
      }
      /* 목록이 없으면 입력 칸 하나만 가운데 */
      #root .tb-buy:not(:has(.tb-buylist)) { grid-template-columns: minmax(0, 1fr); }
      #root .tb-buy:not(:has(.tb-buylist)) > .tb-buyform { max-width: 640px; width: 100%; margin-left: auto; margin-right: auto; }
      #root .tb-buyform { grid-column: 1; grid-row: 1; margin-bottom: 0; padding: 24px 24px; }
      #root .tb-buyform > .grid { row-gap: 18px; }
      #root .tb-buyform input[type=text], #root .tb-buyform select { padding-top: 12px; padding-bottom: 12px; }
      #root .tb-buyform button { font-size: 16px; padding-top: 13px; padding-bottom: 13px; }
      #root .tb-buyform .bg-slate-50 { font-size: 15px; padding: 14px 16px; }
      #root .tb-buylist { grid-column: 2; grid-row: 1; margin-bottom: 0; padding: 22px; display: flex; flex-direction: column; min-height: 0; }
      #root .tb-buyitems { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
      #root .tb-buyitems > div { font-size: 15px; padding: 10px 14px; gap: 8px; }
      #root .tb-buyitems > div > div:first-child { min-width: 0; }
      #root .tb-buyitems > div > div:first-child .font-medium { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #root .tb-buyitems > div > div:first-child > span:last-child { flex-shrink: 0; white-space: nowrap; }
      #root .tb-buyitems > div > div:last-child { flex-shrink: 0; }
      #root .tb-buyitems .text-right > div { white-space: nowrap; }
      #root .tb-buyitems .text-xs { font-size: 13px; }
      #root .tb-buylist > .border-t { font-size: 15px; }

      /* ── 가격 시나리오: 왼쪽 종목 카드 두 단 / 오른쪽 담보비율 ── */
      #root .tb-scn {
        display: grid;
        grid-template-columns: minmax(0, 7fr) minmax(0, 5fr);
        grid-template-rows: minmax(0, 1fr) auto;
        gap: 14px 20px;
        min-height: 0;
      }
      #root .tb-scn > .tb-ratio { grid-column: 2; grid-row: 1; }
      #root .tb-scn:not(:has(.tb-scn-diff)) > .tb-ratio { grid-row: 1 / span 2; }
      #root .tb-scn-diff { grid-column: 2; grid-row: 2; margin-bottom: 0; font-size: 16px; padding: 14px 0; }
      #root .tb-scn-list { grid-column: 1; grid-row: 1 / span 2; display: flex; flex-direction: column; padding: 20px 22px; min-height: 0; }
      #root .tb-scn-list > div:first-child { margin-bottom: 14px; }
      #root .tb-scn-items {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        grid-auto-rows: minmax(min-content, 1fr);
        gap: 14px;
      }
      #root .tb-scn-items > * { margin-top: 0 !important; }
      #root .tb-scn-item { display: flex; flex-direction: column; justify-content: space-between; padding: 14px 16px; }
      /* 이름이 길면 기준가만 다음 줄로 (수량이 잘리지 않게) */
      #root .tb-scn-item > div:first-child { flex-wrap: wrap; column-gap: 8px; row-gap: 2px; }
      #root .tb-scn-item > div:first-child > div { white-space: nowrap; }
      #root .tb-scn-item > div:first-child > div:last-child { margin-left: auto; }
      #root .tb-scn-item .font-medium.text-sm { font-size: 16px; }
      #root .tb-scn-item .text-xs { font-size: 13px; }
      #root .tb-scn-item input[type=number] { width: 72px; }

      /* ── 동기화 창: 조금 넓게 ── */
      #root .tb-modal { max-width: 520px; padding: 26px; }
      #root .tb-modal .text-xs { font-size: 13px; }
    }
    /* 추가매수·시나리오 탭은 화면 높이에 딱 맞추고 목록만 카드 안에서 스크롤한다 —
       슬라이더를 움직이는 동안 오른쪽 결과가 화면 밖으로 밀려나지 않게.
       키보드가 올라와 높이가 줄면(640px 미만) 이 고정을 풀고 페이지 전체가 스크롤된다 */
    @media (min-width: 900px) and (orientation: landscape) and (min-height: 640px) {
      #root .tb-app:has(.tb-panel-buy:not([style*="none"])),
      #root .tb-app:has(.tb-panel-scn:not([style*="none"])) {
        height: 100vh;
        height: 100dvh;
      }
    }
  </style>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').then(reg => {
          // 새 서비스워커가 감지되면 자동으로 페이지 새로고침
          reg.addEventListener('updatefound', () => {
            const newWorker = reg.installing;
            newWorker.addEventListener('statechange', () => {
              if (newWorker.state === 'activated') {
                window.location.reload();
              }
            });
          });
        }).catch(() => {});
      });
    }
  </script>
</head>
<body class="bg-slate-100 min-h-screen">

  <!-- ── 접속 잠금 화면 ── -->
  <div id="appLockScreen">
    <div class="lock-card">
      <div class="lock-icon">🔐</div>
      <div class="lock-title">담보비율 계산기</div>
      <div class="lock-sub" id="lockSub">구글 계정으로 로그인하세요</div>
      <button class="lock-btn-google" id="lockGoogleBtn" onclick="signInWithGoogle()">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24s.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        <span>Google로 로그인</span>
      </button>
      <div class="lock-error" id="lockError"></div>
    </div>
  </div>
<!-- 로그인했던 기기에서는 로그인 버튼 대신 "불러오는 중…"만 보인다 (2026-09-29 — 열 때마다 로그인 화면이 잠깐 비쳤다).
     실제로 로그인이 풀렸으면 onAuthStateChanged가 표시를 지우고 버튼을 되살린다 -->
<script>
  try {
    if (localStorage.getItem('signed_in_before')) {
      document.getElementById('appLockScreen').classList.add('resuming');
      document.getElementById('lockSub').textContent = '불러오는 중…';
    }
  } catch (e) {}
</script>

  <div id="root"></div>

  <!-- ══════════════════════════════════════════════════════════
       클라우드 동기화 부트스트랩 (React 밖의 평범한 스크립트)

       포트폴리오는 이제 이 기기가 아니라 클라우드에 있다.
       PC에서 Claude가 사진을 보고 넣어주면 폰 앱이 켤 때 받아간다.

       프로젝트는 재무현황 앱과 같은 finance-manager-ca4ca를 쓴다.
       계정 허용 목록(allowedUsers)과 보안 규칙을 그대로 물려받으려는 것이다.
       경로만 /dambo 로 따로 둔다.
  ══════════════════════════════════════════════════════════ -->
  <script>
  const firebaseConfig = {
    apiKey: "AIzaSyCyd8s4Vs2rNsACQQtm8NUAYSFO6wLGWX4",
    authDomain: "finance-manager-ca4ca.firebaseapp.com",
    databaseURL: "https://finance-manager-ca4ca-default-rtdb.firebaseio.com",
    projectId: "finance-manager-ca4ca",
    storageBucket: "finance-manager-ca4ca.firebasestorage.app",
    messagingSenderId: "360457300029",
    appId: "1:360457300029:web:b7066af249ce6427a6a254"
  };
  firebase.initializeApp(firebaseConfig);
  const db   = firebase.database();
  const auth = firebase.auth();

  const DAMBO_PATH = 'dambo';
  let currentRole = null;          // 'admin' | 'viewer' | null

  // 기기 사본으로 먼저 열기 (2026-10-15 — 도겸 수면·재무현황과 같은 방식)
  //   전엔 로그인 확인 → 허용 계정 조회 → /dambo 읽기를 다 기다린 뒤에야 그렸다. 이제 지난번 클라우드 문서를
  //   dambo_cache_v1 에 두었다가 로그인했던 기기면 바로 그리고(role 'cached' — 저장 안 함), 클라우드 값이 오면 다시 띄운다.
  //   계정 하나분 — 로그아웃·다른 계정이면 지운다. ?nocache=1 은 사본 없이 열기(비교용)
  const DAMBO_CACHE = 'dambo_cache_v1';
  let shownFromCache = false;
  function readDamboCache() {
    if (/[?&]nocache=1/.test(location.search)) return null;
    try { const c = JSON.parse(localStorage.getItem(DAMBO_CACHE) || 'null'); return c && c.uid && c.cloud && c.cloud.portfolio ? c : null; } catch { return null; }
  }

  function lockMessage(msg, isError) {
    const err = document.getElementById('lockError');
    const sub = document.getElementById('lockSub');
    if (err) err.textContent = isError ? msg : '';
    if (sub && !isError && msg) sub.textContent = msg;
  }

  function signInWithGoogle() {
    const btn = document.getElementById('lockGoogleBtn');
    if (btn) btn.disabled = true;
    lockMessage('', false);
    const provider = new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(provider).catch(err => {
      if (btn) btn.disabled = false;
      // 홈 화면에 설치한 PWA나 인앱 브라우저는 팝업이 막힌다. 그때는 리디렉션으로 넘긴다.
      if (err.code === 'auth/popup-blocked' || err.code === 'auth/operation-not-supported-in-this-environment') {
        auth.signInWithRedirect(provider);
        return;
      }
      if (err.code === 'auth/popup-closed-by-user' || err.code === 'auth/cancelled-popup-request') return;
      lockMessage('로그인에 실패했습니다. (' + err.code + ')', true);
    });
  }

  function damboSignOut() {
    if (!confirm('로그아웃 하시겠습니까?')) return;
    // 로그아웃하면 이 기기의 보유·융자·현금 캐시를 지운다 (S12, 2026-09-03).
    // 추가매수(extraBuys)는 이 기기 사본을 남긴다 (2026-10-09부터 클라우드에도 올라가지만, 오프라인 대비).
    try {
      const prev = JSON.parse(localStorage.getItem('dambo_v1') || 'null');
      const keep = prev && prev.extraBuys ? { extraBuys: prev.extraBuys } : null;
      localStorage.removeItem('dambo_v1');
      localStorage.removeItem(DAMBO_CACHE);
      if (keep) localStorage.setItem('dambo_v1', JSON.stringify(keep));
    } catch {}
    auth.signOut().finally(() => location.reload());
  }

  /**
   * 앱 → 클라우드 저장. 관리자만 쓴다.
   * 추가매수(extraBuys)도 같이 올린다 (2026-10-09 사용자: 폰에서 넣은 6건이 태블릿에 안 보인다).
   * 그전엔 "시뮬레이션이라 기기 전용"으로 두었는데, 사용자는 기기 간에 같이 보길 원한다.
   * 문서 통째로 덮어쓰는 방식은 그대로지만, 2026-10-12부터 **옛 값으로는 덮지 않는다**:
   * 이 기기가 마지막으로 본 updatedAt과 클라우드의 것이 다르면(PC에서 Claude가 넣었거나 다른 기기가 저장)
   * 저장을 멈추고 'stale'을 돌려준다 → 앱이 최신 값을 다시 불러온다.
   * 트랜잭션이라 오프라인에서 고친 것도 다시 연결될 때 서버 값과 비교한 뒤에만 들어간다.
   */
  let knownUpdatedAt = null;       // 이 기기가 마지막으로 읽거나 쓴 클라우드 문서의 updatedAt
  window.damboSave = function (portfolio) {
    if (currentRole !== 'admin') return Promise.resolve('viewer');
    const expected = knownUpdatedAt;
    const next = { portfolio: portfolio, updatedAt: Date.now(), source: 'app' };
    return db.ref(DAMBO_PATH).transaction(cur => {
      if (cur && (cur.updatedAt ?? null) !== expected) return;   // 그사이 다른 곳에서 바뀜 → 쓰지 않는다
      return next;
    }, null, false).then(r => {
      if (!r.committed) return 'stale';
      knownUpdatedAt = next.updatedAt;
      return 'ok';
    }).catch(e => { console.warn('클라우드 저장 실패:', e.message); return 'error'; });
  };

  // 앱으로 다시 돌아왔을 때 클라우드가 바뀌어 있으면 새로 연다 (며칠 열어 둔 화면의 옛 값으로 고치지 않게)
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible' || !currentRole) return;
    db.ref(DAMBO_PATH + '/updatedAt').get().then(s => {
      if ((s.val() ?? null) !== knownUpdatedAt) location.reload();
    }).catch(() => {});
  });

  // 바벨이 JSX를 컴파일하는 데 시간이 걸린다. 인증이 먼저 끝나는 경우가 있어서
  // 준비되면 부르고, 아직이면 대기시켜 둔다. (둘 중 어느 쪽이 먼저여도 동작한다)
  window.__damboBoot = function (payload) {
    if (window.startDamboApp) window.startDamboApp(payload);
    else window.__damboPending = payload;
  };

  auth.onAuthStateChanged(async user => {
    const lock = document.getElementById('appLockScreen');
    const btn  = document.getElementById('lockGoogleBtn');

    if (!user) {
      currentRole = null;
      if (btn) btn.disabled = false;
      try { localStorage.removeItem('signed_in_before'); } catch {}
      if (shownFromCache) { try { localStorage.removeItem(DAMBO_CACHE); } catch {} location.reload(); return; }   // 사본으로 그린 화면을 남기지 않는다
      if (lock && lock.classList.contains('resuming')) {
        lock.classList.remove('resuming');
        const sub = document.getElementById('lockSub');
        if (sub) sub.textContent = '구글 계정으로 로그인하세요';
      }
      if (lock) { lock.style.display = 'flex'; document.body.style.overflow = 'hidden'; }
      return;
    }

    let role = null;
    try {
      role = (await db.ref('allowedUsers/' + user.uid).get()).val();
    } catch (e) {
      console.warn('권한 조회 실패:', e.message);
    }
    if (role !== 'admin' && role !== 'viewer') {
      lockMessage('접근이 허용되지 않은 계정입니다: ' + (user.email || user.uid), true);
      if (btn) btn.disabled = false;
      try { localStorage.removeItem(DAMBO_CACHE); } catch {}
      await auth.signOut();
      return;
    }
    currentRole = role;
    try { localStorage.setItem('signed_in_before', '1'); } catch {}

    // 클라우드를 한 번 읽는다(실시간 구독이 아니다). 못 읽으면 이 기기에 남은 값으로 연다.
    let cloud = null, cloudError = null;
    try {
      cloud = (await db.ref(DAMBO_PATH).get()).val();
      knownUpdatedAt = cloud ? (cloud.updatedAt ?? null) : null;
      try {
        if (cloud && cloud.portfolio) localStorage.setItem(DAMBO_CACHE, JSON.stringify({ uid: user.uid, at: Date.now(), cloud }));
        else localStorage.removeItem(DAMBO_CACHE);
      } catch {}
    } catch (e) {
      cloudError = e.message;
    }

    if (lock) lock.style.display = 'none';
    document.body.style.overflow = '';
    window.__damboBoot({
      portfolio: cloud && cloud.portfolio ? cloud.portfolio : null,
      updatedAt: cloud ? cloud.updatedAt : null,
      source:    cloud ? cloud.source    : null,
      role: role,
      email: user.email || '',
      error: cloudError,
    });
  });

  // 로그인했던 기기 + 사본이 있으면 로그인 확인을 기다리지 않고 바로 그린다. 위 onAuthStateChanged 가 끝나면 진짜 값으로 다시 띄운다
  (function () {
    try {
      if (!localStorage.getItem('signed_in_before')) return;
      const c = readDamboCache();
      if (!c) return;
      shownFromCache = true;
      const lock = document.getElementById('appLockScreen');
      if (lock) lock.style.display = 'none';
      document.body.style.overflow = '';
      window.__damboBoot({ portfolio: c.cloud.portfolio, updatedAt: c.cloud.updatedAt ?? null, source: c.cloud.source ?? null,
        role: 'cached', email: '', error: null, cached: true });
    } catch (e) { console.warn('사본 열기 실패 — 클라우드를 기다린다:', e.message); }
  })();
  </script>

  <script>
  // 주소 이전 (2026-10-15): github.io 공용 주소 → 전용 주소. 옛 주소에선 맨 위에 이동 띠(로그인 화면 위에도).
  // 옮길 기기 설정은 없다 — 보유·추가매수는 클라우드에 있고, 새 주소에선 구글 로그인만 한 번 다시
  (function () {
    if (!/(^|\.)github\.io$/.test(location.hostname)) return;
    const bar = document.createElement('div');
    bar.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:100000;background:#f59e0b;color:#111;padding:10px 12px;text-align:center;font-size:14px;line-height:1.5;font-weight:600';
    bar.innerHTML = '담보비율이 새 주소로 옮겼습니다 <a href="https://minsung-dambo.web.app/" style="margin-left:8px;padding:4px 12px;border-radius:6px;background:#111;color:#fff;text-decoration:none">새 주소로 이동</a>';
    document.body.appendChild(bar);
  })();
  </script>
