<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>담보비율 계산기</title>

  <!-- 옛 주소(github.io)로 들어오면 새 주소로 넘기기만 한다 (2026-11-11 — 전엔 맨 위에 이동 띠만 달고 앱 전체가 그대로 돌았다).
       앱을 띄우지 않고, 그 주소에 남아 있던 이 앱의 기기 사본도 지운다 -->
  <script>
    if (/(^|\.)github\.io$/.test(location.hostname)) {
      window.__damboMoved = true;
      try { localStorage.removeItem('dambo_v1'); localStorage.removeItem('dambo_cache_v1'); } catch (e) {}
      location.replace('https://minsung-dambo.web.app/');
    }
  </script>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e293b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="담보비율">
  <link rel="apple-touch-icon" href="icons/app-any-192.png">

  <!-- React 18.3.1 은 이 앱과 함께 배포한다 (2026-11-11 — 전엔 열 때마다 바깥 저장소에서 받았다. 바깥 파일이 바뀌어도 이 앱은 영향이 없다).
       파일은 공식 배포본 그대로다(vendor/). 버전을 올릴 땐 파일을 바꾸고 sw.js 의 CACHE 를 올린다 -->
  <script src="./vendor/react.production.min.js"></script>
  <script src="./vendor/react-dom.production.min.js"></script>

  <!-- 클라우드 저장 (finance-manager-ca4ca RTDB의 /dambo) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

  <style>
/* 맨 위에서 아래로 당기면 크롬이 페이지를 새로고침하던 것을 막는다 (2026-09-28 사용자 요청 — 새로고침되며 로그인 화면이 다시 떴다) */
html, body { overscroll-behavior-y: none; }
    body { font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; }
    input[type=range] { accent-color: #3b82f6; }
    input[type=range]::-webkit-slider-thumb { cursor: pointer; }

    /* ── 접속 잠금 화면 ── */
    #appLockScreen {
      position: fixed; inset: 0; z-index: 100; display: flex;
      align-items: center; justify-content: center; padding: 24px;
      background: #0f172a;
    }
    .lock-card {
      background: #fff; border-radius: 20px; padding: 32px 26px;
      width: 100%; max-width: 340px; text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,.35);
    }
    .lock-icon  { font-size: 40px; }
    .lock-title { font-size: 18px; font-weight: 800; color: #1e293b; margin-top: 10px; }
    .lock-sub   { font-size: 12px; color: #64748b; margin-top: 6px; }
    #appLockScreen.resuming .lock-btn-google { display: none; }   /* 로그인했던 기기 (2026-09-29) */
    .lock-btn-google {
      margin-top: 20px; width: 100%; display: flex; align-items: center; justify-content: center;
      gap: 8px; padding: 12px; border: 1px solid #e2e8f0; border-radius: 12px;
      background: #fff; font-size: 14px; font-weight: 700; color: #334155; cursor: pointer;
    }
    .lock-btn-google:hover:not(:disabled) { background: #f8fafc; }
    .lock-btn-google:disabled { opacity: .5; cursor: default; }
    .lock-error { font-size: 12px; color: #dc2626; margin-top: 12px; min-height: 16px; }

    /* ============ 태블릿 (2026-09-28) ============
       갤럭시 탭을 가로로 두고 쓸 때. 폰 화면은 건드리지 않고 넓을 때만 덮어쓴다.
       - 폭 제한(max-w-2xl)을 풀고 탭마다 두 단: 왼쪽 입력 / 오른쪽 결과
       - 화면 높이를 채운다 (카드가 남는 높이를 나눠 갖는다, min-height라 길면 스크롤)
       tb-* 클래스는 폰에서는 아무 규칙이 없는 표식이다.
       이 style 뒤에 app.css(테일윈드 규칙)가 오므로 #root를 앞에 달아 우선순위로 이긴다.
       높이 500px 미만(폰을 가로로 돌린 화면)은 뺀다 — 넓다고 태블릿 배치를 쓰면 표가 눌린다 (2026-11-11, screen-layout 규칙) */
    @media (min-width: 900px) and (orientation: landscape) and (min-height: 500px) {
      #root .tb-app {
        max-width: 1320px;
        padding: 20px 28px 24px;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
      }
      #root .tb-header { padding: 18px 28px; margin-bottom: 14px; }
      #root .tb-header h1 { font-size: 24px; }
      #root .tb-header p, #root .tb-header .text-xs { font-size: 13px; }
      #root .tb-header .text-3xl { font-size: 36px; line-height: 40px; }
      #root .tb-tabs { padding: 6px; margin-bottom: 16px; }
      #root .tb-tabs button { font-size: 15px; padding: 11px 0; }

      /* 탭 내용이 남는 높이를 채운다 (보이는 탭만 — 숨긴 탭은 인라인 display:none이 이긴다) */
      #root .tb-panel { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; }
      #root .tb-panel > .tb-buy, #root .tb-panel > .tb-scn { flex: 1 1 auto; }

      /* 입력칸·버튼: 팔 길이에서 보는 화면이라 조금 키운다 */
      #root .tb-app input[type=text], #root .tb-app input[type=number], #root .tb-app select {
        font-size: 16px; padding-top: 9px; padding-bottom: 9px;
      }
      #root .tb-app label { font-size: 13px; }
      #root .tb-app h3 { font-size: 16px; }

      /* ── 담보비율 카드 (포트폴리오·시나리오 오른쪽) ── */
      #root .tb-ratio {
        display: flex; flex-direction: column;
        margin-bottom: 0; padding: 24px 28px 20px;
      }
      #root .tb-ratio .text-gray-500.font-semibold { font-size: 18px; }
      #root .tb-ratio-num { font-size: 56px; line-height: 1.1; }
      #root .tb-ratio-req { font-size: 13px; margin-top: 4px; margin-bottom: 0; }
      /* 눈금 글자(24px)와 눈금 선(28px)이 게이지 상자 안(위쪽 안여백 52px)에 들어간다 —
         전엔 글자가 상자 밖 위로 나가 있어서, 카드가 눌리면 「최저유지…」 줄과 겹쳤다 (2026-11-11) */
      #root .tb-gauge { margin: auto 0; padding: 52px 0 8px; }
      #root .tb-gauge > .tb-gauge-mark { top: 24px; }
      #root .tb-gauge > .h-5 { height: 28px; }
      #root .tb-gauge .w-0\.5 { height: 28px; width: 3px; }
      #root .tb-gauge .-top-5 { font-size: 14px; top: -24px; }
      #root .tb-ratio-grid3, #root .tb-ratio-grid2 { gap: 12px; }
      #root .tb-ratio-grid3 { margin-bottom: 12px; }
      /* 카드 안 칸의 안여백은 「닿는 지점」 상자(2026-11-11)가 들어와도 탭 S7+ 가로(높이 804) 한 화면에 들어가는 크기 */
      #root .tb-ratio-grid3 > div, #root .tb-ratio-grid2 > div { padding: 14px 10px; }
      #root .tb-ratio-grid3 .text-xs, #root .tb-ratio-grid2 .text-xs { font-size: 13px; margin-bottom: 6px; }
      #root .tb-ratio-grid3 .font-bold { font-size: 16px; letter-spacing: 0; }
      #root .tb-ratio-grid2 .font-bold { font-size: 19px; }
      #root .tb-ratio-ref { font-size: 14px; margin-top: 8px; }
      #root .tb-be { font-size: 14px; margin-top: 10px; padding-top: 10px; }

      /* ── 포트폴리오: 왼쪽 종목표·기타 자산 / 오른쪽 담보비율 ── */
      #root .tb-panel-portfolio {
        display: grid;
        grid-template-columns: minmax(0, 7fr) minmax(0, 5fr);
        column-gap: 20px;
        align-items: stretch;
      }
      #root .tb-panel-portfolio > .tb-ratio { grid-column: 2; grid-row: 1; }
      #root .tb-panel-portfolio > .tb-inputs { grid-column: 1; grid-row: 1; display: flex; flex-direction: column; min-height: 0; }
      #root .tb-table-wrap {
        flex: 1 1 auto; margin-bottom: 14px;
        background: #fff; border-radius: 12px;
        box-shadow: 0 1px 3px rgba(0,0,0,.1), 0 1px 2px -1px rgba(0,0,0,.1);
      }
      #root .tb-table { box-shadow: none; font-size: 15px; table-layout: fixed; }
      #root .tb-table th { font-size: 13px; padding: 12px 14px; }
      /* 칸 폭 고정 */
      #root .tb-table th:nth-child(1) { width: 26%; }
      #root .tb-table th:nth-child(2) { width: 11%; }
      #root .tb-table th:nth-child(3) { width: 14.5%; }
      #root .tb-table th:nth-child(4) { width: 18%; }
      #root .tb-table th:nth-child(5) { width: 11%; }
      #root .tb-table th:nth-child(6) { width: 19.5%; }
      #root .tb-table td { padding: 12px 14px; white-space: nowrap; }
      #root .tb-table td:first-child { white-space: normal; }
      #root .tb-table td:last-child { padding: 8px 6px; }
      #root .tb-table td .text-xs { font-size: 13px; }
      #root .tb-table td .tb-rowbtn { font-size: 13px; padding: 8px 11px; }
      /* 수정 카드가 들어가는 줄 */
      #root .tb-table tr.tb-editrow td { padding: 10px; white-space: normal; }
      #root .tb-editcard { padding: 16px; }
      #root .tb-editcard button { font-size: 14px; padding-top: 10px; padding-bottom: 10px; }
      #root .tb-addrow { margin-bottom: 14px; }
      #root .tb-add { font-size: 15px; padding: 10px 22px; }
      #root .tb-etc { padding: 20px 22px; }
      #root .tb-etc-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }

      /* ── 추가매수: 왼쪽 입력(매수 추가 + 입금·상환) | 오른쪽 목록 (두 단, 각각 화면 높이) ── */
      #root .tb-buy {
        display: grid;
        grid-template-columns: minmax(0, 5fr) minmax(0, 6fr);
        gap: 20px;
        min-height: 0;
      }
      #root .tb-buy-left { grid-column: 1; grid-row: 1; display: flex; flex-direction: column; gap: 14px; min-height: 0; overflow-y: auto; padding-bottom: 2px; }
      /* 목록이 없으면 입력 칸 하나만 가운데 */
      #root .tb-buy:not(:has(.tb-buylist)) { grid-template-columns: minmax(0, 1fr); }
      #root .tb-buy:not(:has(.tb-buylist)) > .tb-buy-left { max-width: 640px; width: 100%; margin-left: auto; margin-right: auto; }
      #root .tb-buyform, #root .tb-sim { margin-bottom: 0; padding: 20px 24px; flex: none; }
      #root .tb-buyform > .grid { row-gap: 14px; }
      #root .tb-buyform input[type=text], #root .tb-buyform select { padding-top: 11px; padding-bottom: 11px; }
      #root .tb-buyform button { font-size: 16px; padding-top: 12px; padding-bottom: 12px; }
      #root .tb-buyform .bg-slate-50, #root .tb-sim .bg-slate-50 { font-size: 15px; padding: 14px 16px; }
      #root .tb-sim .text-xs { font-size: 13px; }
      #root .tb-sim button { font-size: 14px; padding-top: 10px; padding-bottom: 10px; }
      #root .tb-buylist { grid-column: 2; grid-row: 1; margin-bottom: 0; padding: 22px; display: flex; flex-direction: column; min-height: 0; }
      #root .tb-buyitems { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
      #root .tb-buyitems > div { font-size: 15px; padding: 10px 14px; }
      #root .tb-buyitems .text-xs { font-size: 13px; }
      #root .tb-buylist > .border-t { font-size: 15px; }

      /* ── 가격 시나리오: 왼쪽 종목 카드 두 단 / 오른쪽 담보비율 ──
         오른쪽 열(.tb-scn-side)에 카드 셋(비율·기준 대비·총잔고)이 쌓이므로 비율 카드는 낮게 그린다.
         비율 카드는 제 내용보다 작아지지 않고(flex: 1 0 auto), 높이가 모자라면 오른쪽 열 안에서 스크롤한다 —
         전엔 카드가 눌려 눈금 글자가 「최저유지…」 줄과 겹치고 아래 칸이 카드 밖으로 나왔다 (2026-11-11) */
      #root .tb-scn {
        display: grid;
        grid-template-columns: minmax(0, 7fr) minmax(0, 5fr);
        grid-template-rows: minmax(0, 1fr);
        gap: 14px 20px;
        min-height: 0;
      }
      #root .tb-scn-side { grid-column: 2; grid-row: 1; display: flex; flex-direction: column; gap: 14px; min-height: 0; overflow-y: auto; }
      #root .tb-scn-side > .tb-ratio { flex: 1 0 auto; padding: 18px 24px 16px; }
      #root .tb-scn-side > .tb-ratio .tb-ratio-num { font-size: 46px; }
      #root .tb-scn-side > .tb-ratio .tb-gauge { padding: 46px 0 4px; }
      #root .tb-scn-side > .tb-ratio .tb-gauge .w-0\.5 { height: 22px; }
      #root .tb-scn-side > .tb-ratio .tb-ratio-grid3 { margin-bottom: 8px; }
      #root .tb-scn-side > .tb-ratio .tb-ratio-grid3 > div, #root .tb-scn-side > .tb-ratio .tb-ratio-grid2 > div { padding: 9px 8px; }
      #root .tb-scn-side > .tb-ratio .tb-ratio-grid3 .text-xs, #root .tb-scn-side > .tb-ratio .tb-ratio-grid2 .text-xs { margin-bottom: 3px; }
      #root .tb-scn-side > .tb-ratio .tb-ratio-ref { margin-top: 8px; font-size: 13px; }
      #root .tb-scn-diff { flex: none; margin-bottom: 0; font-size: 16px; padding: 12px 0; }
      #root .tb-scn-bal { flex: none; margin-bottom: 0; padding: 14px 20px; }
      #root .tb-scn-list { grid-column: 1; grid-row: 1; display: flex; flex-direction: column; padding: 20px 22px; min-height: 0; }
      #root .tb-scn-list > div:first-child { margin-bottom: 14px; }
      #root .tb-scn-items {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        grid-auto-rows: minmax(min-content, 1fr);
        gap: 14px;
      }
      #root .tb-scn-items > * { margin-top: 0 !important; }
      #root .tb-scn-item { display: flex; flex-direction: column; justify-content: space-between; padding: 14px 16px; }
      /* 이름이 길면 기준가만 다음 줄로 (수량이 잘리지 않게) */
      #root .tb-scn-item > div:first-child { flex-wrap: wrap; column-gap: 8px; row-gap: 2px; }
      #root .tb-scn-item > div:first-child > div { white-space: nowrap; }
      #root .tb-scn-item > div:first-child > div:last-child { margin-left: auto; }
      #root .tb-scn-item .font-medium.text-sm { font-size: 16px; }
      #root .tb-scn-item .text-xs { font-size: 13px; }
      #root .tb-scn-item input[type=number] { width: 72px; }

      /* ── 창(백업·체결): 조금 넓게 ── */
      #root .tb-modal { max-width: 520px; padding: 26px; }
      #root .tb-modal .text-xs { font-size: 13px; }
    }
    /* 추가매수·시나리오 탭은 화면 높이에 딱 맞추고 목록만 카드 안에서 스크롤한다 —
       슬라이더를 움직이는 동안 오른쪽 결과가 화면 밖으로 밀려나지 않게.
       키보드가 올라와 높이가 줄면(640px 미만) 이 고정을 풀고 페이지 전체가 스크롤된다 */
    @media (min-width: 900px) and (orientation: landscape) and (min-height: 640px) {
      #root .tb-app:has(.tb-panel-buy:not([style*="none"])),
      #root .tb-app:has(.tb-panel-scn:not([style*="none"])) {
        height: 100vh;
        height: 100dvh;
      }
    }
    /* 아주 좁은 화면(380px 미만)에서는 비율 카드의 금액 세 칸 글자를 한 단계 줄인다 */
    @media (max-width: 379px) { #root .tb-money3 { font-size: 11px; } }
  </style>
  <!-- 화면 꾸밈 규칙(테일윈드)은 미리 만들어 둔 파일을 쓴다 (2026-11-11 — 전엔 열 때마다 바깥 스크립트 407KB 가 브라우저에서 만들었다).
       src/app.jsx·index.html 에서 쓰는 클래스만 들어 있다. 다시 만들기: npm run build -->
  <link rel="stylesheet" href="./app.css?v=20261111b">
  <script>
    if (!window.__damboMoved && 'serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').then(reg => {
          // 새 서비스워커가 감지되면 자동으로 페이지 새로고침
          reg.addEventListener('updatefound', () => {
            const newWorker = reg.installing;
            newWorker.addEventListener('statechange', () => {
              if (newWorker.state === 'activated') {
                window.location.reload();
              }
            });
          });
        }).catch(() => {});
      });
    }
  </script>
</head>
<body class="bg-slate-100 min-h-screen">

  <!-- ── 접속 잠금 화면 ── -->
  <div id="appLockScreen">
    <div class="lock-card">
      <div class="lock-icon">🔐</div>
      <div class="lock-title">담보비율 계산기</div>
      <div class="lock-sub" id="lockSub">구글 계정으로 로그인하세요</div>
      <button class="lock-btn-google" id="lockGoogleBtn" onclick="signInWithGoogle()">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24s.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        <span>Google로 로그인</span>
      </button>
      <div class="lock-error" id="lockError"></div>
    </div>
  </div>
<!-- 로그인했던 기기에서는 로그인 버튼 대신 "불러오는 중…"만 보인다 (2026-09-29 — 열 때마다 로그인 화면이 잠깐 비쳤다).
     실제로 로그인이 풀렸으면 onAuthStateChanged가 표시를 지우고 버튼을 되살린다 -->
<script>
  try {
    if (localStorage.getItem('signed_in_before')) {
      document.getElementById('appLockScreen').classList.add('resuming');
      document.getElementById('lockSub').textContent = '불러오는 중…';
    }
  } catch (e) {}
</script>

  <div id="root"></div>

  <!-- ══════════════════════════════════════════════════════════
       클라우드 동기화 부트스트랩 (React 밖의 평범한 스크립트)

       포트폴리오는 이 기기가 아니라 클라우드에 있다.
       PC에서 Claude가 사진을 보고 넣어주면 폰 앱이 받아간다.

       프로젝트는 재무현황 앱과 같은 finance-manager-ca4ca를 쓴다.
       계정 허용 목록(allowedUsers)과 보안 규칙을 그대로 물려받으려는 것이다.
       경로만 /dambo 로 따로 둔다.
  ══════════════════════════════════════════════════════════ -->
  <script>
  const firebaseConfig = {
    apiKey: "AIzaSyCyd8s4Vs2rNsACQQtm8NUAYSFO6wLGWX4",
    authDomain: "finance-manager-ca4ca.firebaseapp.com",
    databaseURL: "https://finance-manager-ca4ca-default-rtdb.firebaseio.com",
    projectId: "finance-manager-ca4ca",
    storageBucket: "finance-manager-ca4ca.firebasestorage.app",
    messagingSenderId: "360457300029",
    appId: "1:360457300029:web:b7066af249ce6427a6a254"
  };
  let db = null, auth = null;      // damboStart 에서 채운다(옛 주소에서는 채우지 않는다)

  const DAMBO_PATH = 'dambo';
  let currentRole = null;          // 'admin' | 'viewer' | null
  let currentUid = null;

  // 기기 사본으로 먼저 열기 (2026-10-15 — 도겸 수면·재무현황과 같은 방식)
  //   전엔 로그인 확인 → 허용 계정 조회 → /dambo 읽기를 다 기다린 뒤에야 그렸다. 이제 지난번 클라우드 문서를
  //   dambo_cache_v1 에 두었다가 로그인했던 기기면 바로 그리고(role 'cached' — 저장 안 함), 클라우드 값이 오면 다시 띄운다.
  //   계정 하나분 — 로그아웃·다른 계정이면 지운다. ?nocache=1 은 사본 없이 열기(비교용)
  //   2026-11-11: 이 기기의 사본은 이것 하나다. 클라우드에서 읽을 때와 **이 기기가 저장에 성공했을 때** 고쳐 쓴다
  //   (전엔 열 때만 써서, 값을 고친 뒤 다시 열면 첫 화면이 고치기 전 값이었다). 옛 사본 dambo_v1 은 쓰지 않고 지운다
  const DAMBO_CACHE = 'dambo_cache_v1';
  let shownFromCache = false;
  function readDamboCache() {
    if (/[?&]nocache=1/.test(location.search)) return null;
    try { const c = JSON.parse(localStorage.getItem(DAMBO_CACHE) || 'null'); return c && c.uid && c.cloud && c.cloud.portfolio ? c : null; } catch { return null; }
  }
  function writeDamboCache(cloud) {
    try {
      if (currentUid && cloud && cloud.portfolio) localStorage.setItem(DAMBO_CACHE, JSON.stringify({ uid: currentUid, at: Date.now(), cloud }));
      else localStorage.removeItem(DAMBO_CACHE);
    } catch {}
  }
  // 로그인이 풀리는 모든 길에서 이 기기의 보유 내역 사본을 지운다 (2026-11-11 — 전엔 버튼이 아닌 길로 풀리면 dambo_v1 이 남았다)
  function clearDamboCopies() {
    try { localStorage.removeItem(DAMBO_CACHE); localStorage.removeItem('dambo_v1'); } catch {}
  }

  function lockMessage(msg, isError) {
    const err = document.getElementById('lockError');
    const sub = document.getElementById('lockSub');
    if (err) err.textContent = isError ? msg : '';
    if (sub && !isError && msg) sub.textContent = msg;
  }

  function signInWithGoogle() {
    const btn = document.getElementById('lockGoogleBtn');
    if (btn) btn.disabled = true;
    lockMessage('', false);
    const provider = new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(provider).catch(err => {
      if (btn) btn.disabled = false;
      // 홈 화면에 설치한 PWA나 인앱 브라우저는 팝업이 막힌다. 그때는 리디렉션으로 넘긴다.
      if (err.code === 'auth/popup-blocked' || err.code === 'auth/operation-not-supported-in-this-environment') {
        auth.signInWithRedirect(provider);
        return;
      }
      if (err.code === 'auth/popup-closed-by-user' || err.code === 'auth/cancelled-popup-request') return;
      lockMessage('로그인에 실패했습니다. (' + err.code + ')', true);
    });
  }

  function damboSignOut() {
    if (!confirm('로그아웃 하시겠습니까?')) return;
    clearDamboCopies();
    auth.signOut().finally(() => location.reload());
  }

  /**
   * 앱 → 클라우드 저장. 관리자만 쓴다. 문서 통째로 쓰되 **옛 값으로는 덮지 않는다** (2026-10-12):
   * 이 기기가 마지막으로 본 updatedAt과 클라우드의 것이 다르면(PC에서 Claude가 넣었거나 다른 기기가 저장)
   * 쓰지 않고 'stale'을 돌려준다 → 앱이 알린 뒤 최신 값을 받아 넣는다.
   * 트랜잭션이라 오프라인에서 고친 것도 다시 연결될 때 서버 값과 비교한 뒤에만 들어간다.
   *
   * 2026-11-11: **저장은 한 줄로 선다.** 앞 저장이 끝나(knownUpdatedAt 이 올라간) 뒤에 다음 것을 보낸다.
   *   전엔 앞 저장이 가는 도중에 또 보내면, 라이브러리가 둘째에게 "지금 값"으로 첫째의 결과물을 주는데
   *   knownUpdatedAt 은 아직 옛 값이라 "다른 곳에서 바뀌었다"로 잘못 읽었다(느린 망·끊긴 동안 거짓 알림 + 입력 유실).
   *   기다리는 동안 더 새 저장이 들어오면 사이 것은 건너뛴다 — 마지막 상태만 보내면 된다.
   * 돌려주는 값: { r: 'ok', at } | { r: 'stale' } | { r: 'error' } | { r: 'skipped' } | { r: 'viewer' }
   */
  let knownUpdatedAt = null;       // 이 기기가 마지막으로 읽거나 쓴 클라우드 문서의 updatedAt
  const ownWrites = new Set();     // 내가 보내는 중인 updatedAt — 아래 구독이 그 값을 "남이 바꿨다"로 읽지 않게
  let saveTail = Promise.resolve();
  let saveWanted = 0;
  function saveOnce(portfolio) {
    const expected = knownUpdatedAt;
    // 기기 시계가 늦어도 앞 값보다는 크게 — 값이 같으면 다른 기기가 "안 바뀌었다"로 읽는다
    const next = { portfolio: portfolio, updatedAt: Math.max(Date.now(), (typeof expected === 'number' ? expected : 0) + 1), source: 'app' };
    ownWrites.add(next.updatedAt);
    return db.ref(DAMBO_PATH).transaction(cur => {
      if (cur && (cur.updatedAt ?? null) !== expected) return;   // 그사이 다른 곳에서 바뀜 → 쓰지 않는다
      return next;
    }, null, false).then(r => {
      if (!r.committed) { ownWrites.delete(next.updatedAt); return { r: 'stale' }; }
      knownUpdatedAt = next.updatedAt;
      ownWrites.delete(next.updatedAt);
      writeDamboCache(next);
      return { r: 'ok', at: next.updatedAt };
    }).catch(e => { ownWrites.delete(next.updatedAt); console.warn('클라우드 저장 실패:', e && e.message); return { r: 'error' }; });
  }
  window.damboSave = function (portfolio) {
    if (currentRole !== 'admin') return Promise.resolve({ r: 'viewer' });
    const my = ++saveWanted;
    const run = () => (my === saveWanted ? saveOnce(portfolio) : { r: 'skipped' });
    const p = saveTail.then(run, run);
    saveTail = p.catch(() => {});
    return p;
  };

  /**
   * 클라우드 값을 다시 읽어 열려 있는 화면에 넣는다 (2026-11-11 — 전엔 화면을 통째로 새로고침했고, 켜 둔 화면은 돌아올 때만 바뀌었다).
   * 부르는 곳: 아래 updatedAt 구독(다른 곳에서 바뀜) · 앱으로 돌아왔을 때 · 저장이 'stale' 로 끝났을 때
   */
  window.damboRefresh = function () {
    return db.ref(DAMBO_PATH).get().then(s => {
      const cloud = s.val();
      knownUpdatedAt = cloud ? (cloud.updatedAt ?? null) : null;
      writeDamboCache(cloud);
      const doc = { portfolio: cloud && cloud.portfolio ? cloud.portfolio : null,
        updatedAt: cloud ? (cloud.updatedAt ?? null) : null, source: cloud ? (cloud.source ?? null) : null };
      if (window.__damboApp) window.__damboApp.apply(doc); else location.reload();
      return true;
    });
  };
  // 다른 곳에서 바뀐 것을 알았을 때. 이 화면에서 고치는 중이면(안 보낸 수정·수정 카드·입력 중) 기다렸다가 다시 본다 —
  // 그사이 이 화면이 저장을 보내면 그쪽이 '바뀌어 있었다'(stale)로 끝나며 알리고 받아 넣는다
  let remoteSeen = null, remoteTimer = null;
  function onRemoteValue(v) {
    if (!currentRole) return;
    if (v === knownUpdatedAt || ownWrites.has(v)) { remoteSeen = null; return; }
    remoteSeen = v;
    tryRefresh();
  }
  function tryRefresh() {
    clearTimeout(remoteTimer);
    if (remoteSeen === null || remoteSeen === knownUpdatedAt) { remoteSeen = null; return; }
    const app = window.__damboApp;
    if (app && app.busy()) { remoteTimer = setTimeout(tryRefresh, 3000); return; }
    remoteSeen = null;
    window.damboRefresh().catch(() => {});
  }

  // 앱으로 다시 돌아왔을 때 한 번 더 본다 (며칠 열어 둔 화면의 옛 값으로 고치지 않게 — 구독이 다시 붙기 전에도)
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible' || !currentRole || !db) return;
    db.ref(DAMBO_PATH + '/updatedAt').get().then(s => onRemoteValue(s.val() ?? null)).catch(() => {});
  });

  // app.js 가 인증보다 늦게 준비되는 경우가 있어서
  // 준비되면 부르고, 아직이면 대기시켜 둔다. (둘 중 어느 쪽이 먼저여도 동작한다)
  window.__damboBoot = function (payload) {
    if (window.startDamboApp) window.startDamboApp(payload);
    else window.__damboPending = payload;
  };

  let watching = false;
  async function onAuth(user) {
    const lock = document.getElementById('appLockScreen');
    const btn  = document.getElementById('lockGoogleBtn');

    if (!user) {
      currentRole = null; currentUid = null;
      if (btn) btn.disabled = false;
      try { localStorage.removeItem('signed_in_before'); } catch {}
      clearDamboCopies();
      if (shownFromCache) { location.reload(); return; }   // 사본으로 그린 화면을 남기지 않는다
      if (lock && lock.classList.contains('resuming')) {
        lock.classList.remove('resuming');
        const sub = document.getElementById('lockSub');
        if (sub) sub.textContent = '구글 계정으로 로그인하세요';
      }
      if (lock) { lock.style.display = 'flex'; document.body.style.overflow = 'hidden'; }
      return;
    }

    let role = null;
    try {
      role = (await db.ref('allowedUsers/' + user.uid).get()).val();
    } catch (e) {
      console.warn('권한 조회 실패:', e.message);
    }
    if (role !== 'admin' && role !== 'viewer') {
      lockMessage('접근이 허용되지 않은 계정입니다: ' + (user.email || user.uid), true);
      if (btn) btn.disabled = false;
      clearDamboCopies();
      await auth.signOut();
      return;
    }
    currentRole = role;
    currentUid = user.uid;
    try { localStorage.setItem('signed_in_before', '1'); localStorage.removeItem('dambo_v1'); } catch {}

    // 클라우드를 읽는다. 못 읽으면 이 기기에 남은 지난번 값(같은 계정의 사본)으로 연다.
    let cloud = null, cloudError = null;
    try {
      cloud = (await db.ref(DAMBO_PATH).get()).val();
      writeDamboCache(cloud);
    } catch (e) {
      cloudError = e.message;
      const c = readDamboCache();
      cloud = c && c.uid === user.uid ? c.cloud : null;
    }
    knownUpdatedAt = cloud ? (cloud.updatedAt ?? null) : null;

    if (lock) lock.style.display = 'none';
    document.body.style.overflow = '';
    window.__damboBoot({
      portfolio: cloud && cloud.portfolio ? cloud.portfolio : null,
      updatedAt: cloud ? cloud.updatedAt : null,
      source:    cloud ? cloud.source    : null,
      role: role,
      email: user.email || '',
      error: cloudError,
    });

    // 다른 곳(PC·다른 기기)에서 바뀌면 알아챈다 — 문서 전체가 아니라 updatedAt 한 값만 구독한다
    if (!watching) {
      watching = true;
      db.ref(DAMBO_PATH + '/updatedAt').on('value', s => onRemoteValue(s.val() ?? null), () => { watching = false; });
    }
  }

  function damboStart() {
    firebase.initializeApp(firebaseConfig);
    db   = firebase.database();
    auth = firebase.auth();
    // 연결 상태 → 화면(상태 줄의 「오프라인」)
    db.ref('.info/connected').on('value', s => {
      window.__damboOnline = s.val() === true;
      if (window.__damboNet) window.__damboNet(window.__damboOnline);
    });
    auth.onAuthStateChanged(onAuth);

    // 로그인했던 기기 + 사본이 있으면 로그인 확인을 기다리지 않고 바로 그린다. 위 onAuth 가 끝나면 진짜 값으로 다시 띄운다
    try {
      if (!localStorage.getItem('signed_in_before')) return;
      const c = readDamboCache();
      if (!c) return;
      shownFromCache = true;
      const lock = document.getElementById('appLockScreen');
      if (lock) lock.style.display = 'none';
      document.body.style.overflow = '';
      window.__damboBoot({ portfolio: c.cloud.portfolio, updatedAt: c.cloud.updatedAt ?? null, source: c.cloud.source ?? null,
        role: 'cached', email: '', error: null, cached: true });
    } catch (e) { console.warn('사본 열기 실패 — 클라우드를 기다린다:', e.message); }
  }
  if (!window.__damboMoved) damboStart();
  </script>
